name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder
      CRON_SECRET: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run test:canonical-contract
      - run: npm run test:canonical-resolution
      - run: npm run test:api-exposure
      - run: npm run test:frontend-contract
      - run: npm run test:security
      - run: npm run test:ssrf
      - run: npm run test:api-persistence
      - run: npm run test:1.3.2
      - run: npm run test:1.4.2
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
